[package]
name = "morfa-files"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Stevfler/morfa"

[lib]
name = "morfa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = "8"
trash = "5"
sysinfo = "0.40"
dirs = "6"
ureq = "3"
sha2 = "0.10"
calamine = "0.38.0"
quick-xml = "0.42.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
base64 = "0.22"
percent-encoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tar = "0.4.46"
flate2 = "1.1.10"
ruzstd = "0.9.1"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "encoder"] }
bzip2 = "0.6.1"
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["aes256", "bzip2", "ppmd"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["compress"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
