default:
  tags: [work_server]

stages:
  - image
  - build
  - release
  - mirror

variables:
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE/builder

# ---------------------------------------------------------------------------
# Сборочные образы. Пересобираются только при изменении ci/docker/** на основной ветке
# или вручную (Run pipeline в вебе → play на нужном job'е). Обычный пуш в main их не трогает.
# ---------------------------------------------------------------------------
build-image:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # Раннер не монтирует /certs, поэтому dind без TLS на 2375.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  parallel:
    matrix:
      - NAME: ubuntu-22.04
        DOCKERFILE: debian.Dockerfile
        BASE: ubuntu:22.04
      - NAME: ubuntu-24.04
        DOCKERFILE: debian.Dockerfile
        BASE: ubuntu:24.04
      - NAME: debian-12
        DOCKERFILE: debian.Dockerfile
        BASE: debian:12
      - NAME: fedora
        DOCKERFILE: fedora.Dockerfile
        BASE: fedora:42
      - NAME: arch
        DOCKERFILE: arch.Dockerfile
        BASE: ""
      - NAME: windows
        DOCKERFILE: windows.Dockerfile
        BASE: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ci/docker/**
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - IMAGE="$IMAGE_PREFIX-$NAME:latest"
    - docker pull "$IMAGE" || true
    - |
      BUILD_ARGS=""
      [ -n "$BASE" ] && BUILD_ARGS="--build-arg BASE=$BASE"
      # BUILDKIT_INLINE_CACHE кладёт кэш слоёв в сам образ, иначе --cache-from ничего не даёт
      # и каждый раз всё собирается с нуля.
      docker build --cache-from "$IMAGE" --build-arg BUILDKIT_INLINE_CACHE=1 $BUILD_ARGS -f "ci/docker/$DOCKERFILE" -t "$IMAGE" ci/docker
    - docker push "$IMAGE"

# ---------------------------------------------------------------------------
# Сборка релиза: только на теге vX.Y.Z; версия приложения проставляется из тега.
# ---------------------------------------------------------------------------
.release-build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.bun-cache
    CARGO_TARGET_DIR: $CI_PROJECT_DIR/src-tauri/target
  before_script:
    # Версия приложения берётся из тега: tauri.conf.json ссылается на package.json, его и переписываем.
    - |
      jq --arg v "${CI_COMMIT_TAG#v}" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
    # cargo/rustup-бинари лежат в образе, а реестр крейтов — в кэшируемом $CARGO_HOME
    - export PATH="/usr/local/cargo/bin:$PATH"
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - release/

linux:
  extends: .release-build
  image: $CI_REGISTRY_IMAGE/builder-$NAME:latest
  parallel:
    matrix:
      - NAME: ubuntu-22.04
        DISTRO: ubuntu22.04
        BUNDLES: deb
      - NAME: ubuntu-22.04
        DISTRO: universal
        BUNDLES: appimage
      - NAME: ubuntu-24.04
        DISTRO: ubuntu24.04
        BUNDLES: deb
      - NAME: debian-12
        DISTRO: debian12
        BUNDLES: deb
      - NAME: fedora
        DISTRO: fedora
        BUNDLES: rpm
      - NAME: arch
        DISTRO: arch
        BUNDLES: arch
  variables:
    # AppImage-тулзы (linuxdeploy) сами являются AppImage: FUSE в контейнере нет.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    NO_STRIP: "true"
  cache:
    - key: cargo-$DISTRO
      paths: [.cargo/registry, src-tauri/target]
    - key:
        files: [bun.lock]
      paths: [.bun-cache]
  script:
    - sh ci/build-linux.sh

windows:
  extends: .release-build
  image: $CI_REGISTRY_IMAGE/builder-windows:latest
  variables:
    XWIN_CACHE_DIR: $CI_PROJECT_DIR/.xwin
    WIN_TARGET: x86_64-pc-windows-msvc
    # tauri-cli на Linux-хосте ищет appindicator через pkg-config даже для Windows-таргета.
    TAURI_LINUX_AYATANA_APPINDICATOR: "true"
    # CRT из xwin идёт без .pdb: глушим LNK4099 у lld-link и вывод линкера в rustc.
    CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C link-arg=/ignore:4099 -A linker_messages"
  cache:
    - key: cargo-windows
      paths: [.cargo/registry, src-tauri/target]
    - key: xwin
      paths: [.xwin]
    - key:
        files: [scripts/fetch-vips-win.ts, scripts/fetch-ffmpeg-win.ts]
        prefix: vendor-win
      paths: [src-tauri/vendor]
    - key:
        files: [bun.lock]
      paths: [.bun-cache]
  script:
    - bun install --frozen-lockfile
    - bunx tauri build --runner cargo-xwin --target "$WIN_TARGET" --bundles nsis --config src-tauri/tauri.windows.conf.json
    - mkdir -p release
    - cp src-tauri/target/$WIN_TARGET/release/bundle/nsis/*-setup.exe release/

# ---------------------------------------------------------------------------
# Публикация: файлы → Generic Package Registry, релиз → Deploy › Releases.
# ---------------------------------------------------------------------------
gitlab-release:
  stage: release
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    GIT_DEPTH: 0
  needs:
    - job: linux
      artifacts: true
    - job: windows
      artifacts: true
  before_script:
    - apk add --no-cache curl jq git
  script:
    - sh ci/release.sh

# ---------------------------------------------------------------------------
# Публичное зеркало на GitHub (ci/github.sh). Работает, только если задан GITHUB_TOKEN.
# Пуши в main и теги зеркалятся сразу; релиз с файлами выкладывается после сборки.
# ---------------------------------------------------------------------------
.github:
  image: alpine:3.22
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache curl jq git

github-mirror:
  extends: .github
  stage: mirror
  needs: []
  rules:
    - if: $GITHUB_TOKEN == null || $GITHUB_TOKEN == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - sh ci/github.sh mirror

github-release:
  extends: .github
  stage: mirror
  rules:
    - if: $GITHUB_TOKEN == null || $GITHUB_TOKEN == ""
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: github-mirror
    - job: linux
      artifacts: true
    - job: windows
      artifacts: true
  script:
    - sh ci/github.sh release
